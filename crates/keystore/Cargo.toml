[package]
name = "openvault-keystore"
description = "Where an OpenVault device keeps its keys: a key file, or the Secure Enclave."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openvault-core = { path = "../core" }
openvault-crypto = { path = "../crypto" }
thiserror = "2"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString"] }
objc2-local-authentication = { version = "0.3.2", features = ["LAContext"] }
security-framework = "3.7.0"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3.27.0"
