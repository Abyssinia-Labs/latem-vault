[package]
name = "latem-vault-ffi"
description = "Swift bindings to the latem vault service's local API, for the Mac app (UniFFI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "latem_vault_ffi"
# A static library for the app to link, and a dynamic one for uniffi-bindgen to read.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
# Generates the Swift bindings from the built library (scripts/swift-bindings.sh).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow = "1.0.104"
latem-vault-core = { path = "../core" }
latem-vault-crypto = { path = "../crypto" }
latem-vault-keystore = { path = "../keystore" }
latem-vault-service = { path = "../service" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
uniffi = { version = "0.32.2", features = ["cli"] }
zeroize = "1.9"
