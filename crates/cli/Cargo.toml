[package]
name = "openvault-cli"
description = "The openvault command."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "openvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
openvault-core = { path = "../core" }
openvault-crypto = { path = "../crypto" }
openvault-keystore = { path = "../keystore" }
rpassword = "7.5.4"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
