[package]
name = "pinkvault-cli"
description = "The pinkvault command."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pinkvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pinkvault-core = { path = "../core" }
pinkvault-crypto = { path = "../crypto" }
pinkvault-grandfather = { path = "../grandfather", optional = true }
pinkvault-keystore = { path = "../keystore" }
pinkvault-net = { path = "../net" }
pinkvault-service = { path = "../service" }
rpassword = "7.5.4"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.9"

[features]
# `pinkvault grandfather` and `pinkvault coordinator`, for reaching the vault's devices away from
# home (coordinator.md). Off by default: devices find each other on the local network only.
coordinator = ["dep:pinkvault-grandfather", "pinkvault-service/coordinator"]

[dev-dependencies]
tempfile = "3.27.0"

# The user id, for launchd's gui/<uid> domain and loginctl (login.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
