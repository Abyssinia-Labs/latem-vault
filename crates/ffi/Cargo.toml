[package]
name = "openvault-ffi"
description = "Swift bindings to the OpenVault service's local API, for the Mac app (UniFFI)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "openvault_ffi"
# A static library for the app to link, and a dynamic one for uniffi-bindgen to read.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
# Generates the Swift bindings from the built library (scripts/swift-bindings.sh).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
openvault-core = { path = "../core" }
openvault-keystore = { path = "../keystore" }
openvault-service = { path = "../service" }
thiserror = "2"
uniffi = { version = "0.32.2", features = ["cli"] }
zeroize = "1.9"
