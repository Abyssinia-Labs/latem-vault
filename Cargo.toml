[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.4"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Abyssinia-Labs/openvault"
publish = false

# Argon2id unoptimized takes seconds, which tests and debug builds would spend on every key file.
[profile.dev.package.argon2]
opt-level = 3
