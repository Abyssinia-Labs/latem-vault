[package]
name = "openvault-grandfather"
description = "The grandfather: a vault's relay and coordinator, on its always-on machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "1.4.1", default-features = false, features = ["server", "tls-ring"] }
openvault-core = { path = "../core" }
openvault-crypto = { path = "../crypto" }
openvault-net = { path = "../net" }
rusqlite = { version = "0.41", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zeroize = "1.9"

[dev-dependencies]
n0-future = "0.3"
rcgen = "0.14"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
