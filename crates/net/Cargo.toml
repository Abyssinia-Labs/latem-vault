[package]
name = "latem-vault-net"
description = "A latem vault device's iroh endpoint, and how it finds other devices on the local network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# No port mapping, so nothing outside the local network learns the endpoint unless a coordinator
# is configured (service.md, coordinator.md).
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3"
latem-vault-core = { path = "../core" }
latem-vault-crypto = { path = "../crypto" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "net"] }
tracing = "0.1"
# For the layer that notices when mDNS stops (watch.rs).
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
