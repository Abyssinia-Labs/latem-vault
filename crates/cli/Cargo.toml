[package]
name = "openvault-cli"
description = "The openvault command."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "openvault"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
openvault-core = { path = "../core" }
openvault-crypto = { path = "../crypto" }
openvault-grandfather = { path = "../grandfather", optional = true }
openvault-keystore = { path = "../keystore" }
openvault-net = { path = "../net" }
openvault-service = { path = "../service" }
rpassword = "7.5.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1.9"

[features]
# `openvault grandfather` and `openvault coordinator`, for reaching the vault's devices away from
# home (coordinator.md). Off by default: devices find each other on the local network only.
coordinator = ["dep:openvault-grandfather", "openvault-service/coordinator"]

[dev-dependencies]
tempfile = "3.27.0"

# The user id, for launchd's gui/<uid> domain and loginctl (login.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
