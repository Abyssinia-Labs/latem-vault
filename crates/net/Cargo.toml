[package]
name = "openvault-net"
description = "An OpenVault device's iroh endpoint, and how it finds other devices on the local network."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# No port mapping, so nothing outside the local network learns the endpoint (service.md).
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "fast-apple-datapath"] }
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3"
openvault-core = { path = "../core" }
openvault-crypto = { path = "../crypto" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
