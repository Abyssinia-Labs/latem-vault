# A release, from a pushed vMAJOR.MINOR.PATCH tag on main. docs/release.md is the part a
# person does; this is the rest.
#
# What a release is. The names are a contract with the Homebrew tap's bin/bump-pinkvault,
# which looks for exactly these:
#
#   pinkvault_<version>_<os>_<arch>.tar.gz    the binary at the archive root, `pink`
#                                             as a relative link to it, the licences, README
#   pinkvault_<version>_checksums.txt         sha256 of every archive above
#   pinkvault_<version>_checksums.txt.minisig its minisign signature, by pinkvault.pub's key
#
# <version> has no leading `v`; the tag does. os is darwin or linux, arch arm64 or amd64.
#
# One signature, over the manifest: it binds each archive to a name that carries the version, so
# a genuine archive can't be passed off as another release's. The signature's trusted comment is
# "pinkvault <tag>", and the tap checks that too.
#
# `workflow_dispatch` is a rehearsal: it runs the checks, builds and smoke-tests all four
# archives and writes the manifest, and signs and publishes nothing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two releases of one tag at once, and never cancelled halfway through a publish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  # The tag's shape, its place on main, and the version the crates say, before anything is built.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      bare: ${{ steps.version.outputs.bare }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          crates=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" != push ]; then
            # A rehearsal builds the crates' version, and publishes nothing.
            version="v$crates"
          else
            version="$GITHUB_REF_NAME"
            if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$version is not a release tag: a tag is vMAJOR.MINOR.PATCH." >&2
              exit 1
            fi
            if [ "${version#v}" != "$crates" ]; then
              echo "::error::the tag is $version, and Cargo.toml says $crates." >&2
              echo "The binary would print a version that isn't the release's. Bump the version" >&2
              echo "on main first (docs/release.md)." >&2
              exit 1
            fi
            # Every release is a tag on main (README, versions), so a release is never built
            # from a commit main doesn't have.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$version is on $GITHUB_SHA, which isn't on main." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bare=${version#v}" >> "$GITHUB_OUTPUT"

  # ci.yml on both platforms, against the exact tree being shipped: a tag can be pushed on any
  # commit of main, including one whose push run failed.
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  # Each archive is built on a machine of its own platform and run there, so nothing is
  # published that its platform hasn't executed. Linux builds are static (musl), so they run on
  # any distribution's glibc, or none.
  build:
    needs: [version, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, target: aarch64-apple-darwin, os: darwin, arch: arm64 }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, os: darwin, arch: amd64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, os: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: pinkvault_${{ needs.version.outputs.bare }}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
            # The C in the build (SQLite, ring) compiled against musl too.
            cc_var="CC_$(printf '%s' "$TARGET" | tr - _)"
            echo "$cc_var=musl-gcc" >> "$GITHUB_ENV"
          fi
      - name: build
        run: cargo build --release --locked -p pinkvault-cli --target "$TARGET"
      - name: run it here
        env:
          BARE: ${{ needs.version.outputs.bare }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/pinkvault"
          echo "==> $TARGET on $(uname -srm)"
          file "$bin"
          # The version and commit the binary prints are what the release is: a build that lost
          # the commit (build.rs) says "unknown".
          want="pinkvault $BARE ($(git rev-parse --short=7 HEAD))"
          got=$("$bin" --version)
          if [ "$got" != "$want" ]; then
            echo "::error::the binary says \"$got\", and this release is \"$want\"" >&2
            exit 1
          fi
          "$bin" --help > /dev/null
          if [ "$RUNNER_OS" = Linux ] && ! file "$bin" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::the Linux binary isn't static, so it would need this runner's glibc" >&2
            exit 1
          fi
      - name: archive
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/pinkvault" dist/
          # The short names, as latem has ltm: relative links, so they run the pinkvault
          # beside them wherever the archive is unpacked. The same list as SHORT in
          # crates/cli/src/name.rs.
          short_names="pink"
          for name in $short_names; do
            ln -s pinkvault "dist/$name"
          done
          # shellcheck disable=SC2086 # one word per name
          tar -czf "dist/$ARCHIVE" -C dist pinkvault $short_names -C "$GITHUB_WORKSPACE" \
            LICENSE-APACHE LICENSE-MIT README.md
          for name in pinkvault $short_names; do
            rm "dist/$name"
          done
          # Unpacked, each name runs the binary, and its hints name it.
          unpacked=$(mktemp -d)
          tar -xzf "dist/$ARCHIVE" -C "$unpacked"
          for name in $short_names; do
            test "$(readlink "$unpacked/$name")" = pinkvault
            "$unpacked/$name" --version
            case "$("$unpacked/$name" --help)" in
              *"Usage: $name "*) ;;
              *) echo "::error::$name --help doesn't name $name in its usage" >&2; exit 1 ;;
            esac
          done
          rm -rf "$unpacked"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ env.ARCHIVE }}
          retention-days: 7
          if-no-files-found: error

  checksums:
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - env:
          BARE: ${{ needs.version.outputs.bare }}
        run: |
          set -euo pipefail
          cd dist
          set -- *.tar.gz
          test "$#" -eq 4
          # A glob is sorted, so the same archives make the same manifest.
          sha256sum -- "$@" > "pinkvault_${BARE}_checksums.txt"
          sha256sum -c "pinkvault_${BARE}_checksums.txt"
          cat "pinkvault_${BARE}_checksums.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # The release environment's secrets can be read only from a v* tag (its deployment rule), so a
  # workflow changed on a branch can't reach the signing key.
  sign:
    needs: [version, checksums]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    env:
      BARE: ${{ needs.version.outputs.bare }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # The key is written to a 0600 file in a private directory, removed in the same step, and
      # never echoed.
      - name: sign the checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY and MINISIGN_PASSWORD must be set on the release environment (docs/release.md)." >&2
            exit 1
          fi
          keydir=$(mktemp -d)
          chmod 700 "$keydir"
          trap 'rm -rf "$keydir"' EXIT
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keydir/minisign.key"
          # The trusted comment is signed as well; the tap checks it names this release.
          printf '%s\n' "$MINISIGN_PASSWORD" |
            minisign -S -s "$keydir/minisign.key" -m "dist/pinkvault_${BARE}_checksums.txt" \
              -t "pinkvault ${VERSION}"
      # Against the committed key, which is the one the tap and anyone checking by hand use: this
      # is what catches a secret holding some other key.
      - name: verify against pinkvault.pub
        run: |
          minisign -V -p pinkvault.pub \
            -m "dist/pinkvault_${BARE}_checksums.txt" \
            -x "dist/pinkvault_${BARE}_checksums.txt.minisig"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signature
          path: dist/*.minisig
          if-no-files-found: error

  publish:
    needs: [version, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BARE: ${{ needs.version.outputs.bare }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signature
          path: dist
      # Not --clobber, and it fails if the release exists: a re-run over a published release, or
      # a moved tag, wants a person (docs/release.md).
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${VERSION}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing. Every release says what changed (docs/release.md)." >&2
            exit 1
          fi
          pubkey=$(sed -n 2p pinkvault.pub)
          keyid=$(sed -n 's/^untrusted comment: minisign public key //p' pinkvault.pub)
          body=$(mktemp)
          cat "$notes" > "$body"
          cat >> "$body" <<EOF

          ## Checking a download

          \`pinkvault_${BARE}_checksums.txt\` lists the sha256 of each archive, and it is signed
          with PinkVault's release key \`${keyid}\` ([pinkvault.pub](https://github.com/${GITHUB_REPOSITORY}/blob/main/pinkvault.pub)):

          \`\`\`sh
          minisign -Vm pinkvault_${BARE}_checksums.txt -P '${pubkey}'
          shasum -a 256 -c --ignore-missing pinkvault_${BARE}_checksums.txt
          \`\`\`

          The Homebrew formula checks the same signature before it takes a sha256.
          EOF
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "PinkVault ${BARE}" \
            --notes-file "$body" \
            dist/*.tar.gz \
            "dist/pinkvault_${BARE}_checksums.txt" \
            "dist/pinkvault_${BARE}_checksums.txt.minisig"
